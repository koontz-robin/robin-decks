<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Win-Back Dashboard</title>
<style>
:root{--navy:#071426;--panel:#0e2038;--panel2:#132a47;--line:#24415f;--text:#f4f8fc;--muted:#92a8bd;--green:#38d27a;--blue:#45a8ff;--amber:#ffb547;--red:#ff6b72;--purple:#a88bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#12345a 0,transparent 35%),var(--navy);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.top h1{font-size:30px;margin:5px 0 3px}.sub{color:var(--muted);font-size:13px}.actions,.filters,.form-actions{display:flex;gap:9px;flex-wrap:wrap}button,.file-label{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px 13px;font-weight:700;font-size:12px;cursor:pointer}button:hover,.file-label:hover{border-color:var(--blue)}button.primary{background:var(--green);border-color:var(--green);color:#052114}button.danger{color:#ff9da2}.file-label input{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:linear-gradient(145deg,var(--panel),#0a1a2e);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:27px;margin-top:5px}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.workspace{display:grid;grid-template-columns:390px 1fr;gap:15px}.side,.detail{background:rgba(14,32,56,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden}.side-head{padding:14px;border-bottom:1px solid var(--line)}input,textarea,select{width:100%;background:#091a2e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}.search{margin-bottom:10px}.filters select{flex:1}.accounts{max-height:675px;overflow:auto}.account{padding:14px;border-bottom:1px solid #18334f;cursor:pointer}.account:hover,.account.active{background:#153251}.account.active{box-shadow:inset 3px 0 var(--green)}.account-name{display:flex;justify-content:space-between;gap:8px;font-weight:750}.meta{color:var(--muted);font-size:11px;margin-top:7px;display:flex;gap:9px;align-items:center}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.status-not-started{background:#52667b33;color:#abc0d2}.status-researching{background:#a88bff22;color:#c7b7ff}.status-ready-to-send{background:#ffb54722;color:#ffc66f}.status-sent{background:#45a8ff22;color:#7ac1ff}.status-replied{background:#38d27a22;color:#67e49b}.status-won-back{background:#38d27a;color:#062615}.status-not-now{background:#ff6b7222;color:#ff969b}.empty{padding:42px 20px;text-align:center;color:var(--muted)}.detail{padding:20px}.detail-top{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:18px}.detail h2{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:0 0 6px}.span2{grid-column:1/-1}textarea{resize:vertical;min-height:90px}.email{min-height:290px;line-height:1.5}.save-note{color:var(--muted);font-size:11px;align-self:center}.form-actions{margin-top:16px}.tip{background:#0a1b2e;border:1px solid #284967;border-radius:9px;padding:11px;color:#a9bfd1;font-size:12px;margin-bottom:14px}.tip b{color:var(--green)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.accounts{max-height:330px}.top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.app{padding:14px}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.actions{width:100%}.actions>*{flex:1;text-align:center}}
</style>
</head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">Rev.io • Retention Intelligence</div><h1>Client Win-Back Dashboard</h1><div class="sub">Turn cancellation context into precise, credible re-engagement.</div></div><div class="actions"><button class="primary" onclick="addAccount()">+ Add Client</button><button onclick="exportData()">Export Backup</button><label class="file-label">Import Backup<input id="importFile" type="file" accept="application/json" onchange="importData(event)"></label></div></header>
<section class="stats"><div class="stat"><span>Total Clients</span><b id="totalKpi">0</b></div><div class="stat"><span>Drafts Ready</span><b id="readyKpi">0</b></div><div class="stat"><span>Outreach Sent</span><b id="sentKpi">0</b></div><div class="stat"><span>Won Back</span><b id="wonKpi">0</b></div></section>
<section class="workspace"><aside class="side"><div class="side-head"><input class="search" id="search" placeholder="Search clients or cancellation reasons…" oninput="renderList()"><div class="filters"><select id="statusFilter" onchange="renderList()"><option value="">All statuses</option><option>Not Started</option><option>Researching</option><option>Ready to Send</option><option>Sent</option><option>Replied</option><option>Won Back</option><option>Not Now</option></select></div></div><div class="accounts" id="accounts"></div></aside><section class="detail" id="detail"></section></section>
</main>
<script>
const KEY='revio-client-winback-v1';
const seed=[
{id:'cmj-securco',company:'CMJ/Securco',contact:'',email:'',cancelDate:'2025-10-31',status:'Ready to Send',reason:`Early product gaps (product catalog fields/searchability, parent/child structure and billing) were compounded by data migration issues, driving early frustration. Continued functionality needs — package support and next-service-date fields for automated scheduling — led to eventual departure.\n\nAsset Tab: Customer column filtering does not work, limiting month-to-month preview of upcoming jobs.\n\nCustomer Tab: No fields to track last-service and next-service dates; recurring contracts were still in development.\n\nService Quoting: No way to hide individual product and labor prices while showing only the grand total.`,productUpdates:'Confirm current status of asset filtering, service-date fields/recurring contracts, package support, parent-child billing, catalog search, migration process, and quote price visibility before sending.',subject:'Worth another look at Rev.io PSA?',draft:`Hi [First Name],\n\nI wanted to reconnect regarding your experience with Rev.io PSA. When CMJ/Securco left, you had legitimate concerns around product catalog searchability, parent/child account structures and billing, migration quality, automated service scheduling, asset filtering, and quote presentation.\n\nThose gaps created frustration early and made the platform harder to use for critical workflows like planning upcoming service jobs and presenting bundled pricing. I’d like to show you how the platform has evolved since then and specifically revisit those requirements—not give you a generic product tour.\n\nWould you be open to a brief conversation to review what has changed and determine whether Rev.io PSA is now a better fit for CMJ/Securco?\n\nBest,\nRyan`,lastContact:'',nextStep:'Validate product changes, personalize the email, then send.',notes:''},
...['Global Data Technologies','Simple Innovations Group','Fire-X','Losh Network Services','West Virginia Security','Particle Communications','Eternal Networks','Semetra'].map((company,i)=>({id:'seed-'+i,company,contact:'',email:'',cancelDate:'',status:'Not Started',reason:'',productUpdates:'',subject:'',draft:'',lastContact:'',nextStep:'Add cancellation reasons and relevant product updates.',notes:''}))
];
let data=load(),selected=data[0]?.id||null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:seed}catch(e){return seed}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));renderStats();renderList()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusClass(s){return 'status-'+s.toLowerCase().replace(/ /g,'-')}
function renderStats(){document.querySelector('#totalKpi').textContent=data.length;document.querySelector('#readyKpi').textContent=data.filter(x=>x.draft.trim()).length;document.querySelector('#sentKpi').textContent=data.filter(x=>['Sent','Replied','Won Back'].includes(x.status)).length;document.querySelector('#wonKpi').textContent=data.filter(x=>x.status==='Won Back').length}
function renderList(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#statusFilter').value;const rows=data.filter(x=>(!f||x.status===f)&&(`${x.company} ${x.reason} ${x.contact}`.toLowerCase().includes(q)));document.querySelector('#accounts').innerHTML=rows.length?rows.map(x=>`<div class="account ${x.id===selected?'active':''}" onclick="selectAccount('${x.id}')"><div class="account-name"><span>${esc(x.company||'Untitled Client')}</span><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><div class="meta"><span>${x.cancelDate?'Canceled '+esc(x.cancelDate):'Cancellation date needed'}</span>${x.draft?'<span>• Draft ready</span>':''}</div></div>`).join(''):'<div class="empty">No clients match this view.</div>'}
function selectAccount(id){selected=id;renderList();renderDetail()}
function field(label,key,type='text',cls=''){const x=data.find(a=>a.id===selected);if(type==='textarea')return `<div class="field ${cls}"><label>${label}</label><textarea data-key="${key}">${esc(x[key])}</textarea></div>`;return `<div class="field ${cls}"><label>${label}</label><input type="${type}" data-key="${key}" value="${esc(x[key])}"></div>`}
function renderDetail(){const x=data.find(a=>a.id===selected);if(!x){document.querySelector('#detail').innerHTML='<div class="empty">Select a client or add a new one.</div>';return}document.querySelector('#detail').innerHTML=`<div class="detail-top"><div><div class="eyebrow">Win-back profile</div><h2>${esc(x.company||'Untitled Client')}</h2></div><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></div><div class="tip"><b>Credibility check:</b> Verify every claimed product improvement before sending. The strongest win-back emails acknowledge the old problem and prove the new reality.</div><div class="grid">${field('Company','company')}${field('Cancellation Date','cancelDate','date')}${field('Contact Name','contact')}${field('Contact Email','email','email')}<div class="field"><label>Status</label><select data-key="status">${['Not Started','Researching','Ready to Send','Sent','Replied','Won Back','Not Now'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div>${field('Last Contact','lastContact','date')}${field('Cancellation Reasons','reason','textarea','span2')}${field('Confirmed Product Updates / Proof Points','productUpdates','textarea','span2')}${field('Email Subject','subject','text','span2')}<div class="field span2"><label>Re-engagement Email</label><textarea class="email" data-key="draft">${esc(x.draft)}</textarea></div>${field('Next Step','nextStep','text','span2')}${field('Internal Notes','notes','textarea','span2')}</div><div class="form-actions"><button class="primary" onclick="saveCurrent()">Save Changes</button><button onclick="copyEmail()">Copy Email</button><button class="danger" onclick="deleteCurrent()">Delete Client</button><span class="save-note">Saved in this browser. Use Export Backup to move or preserve data.</span></div>`}
function saveCurrent(){const x=data.find(a=>a.id===selected);document.querySelectorAll('[data-key]').forEach(el=>x[el.dataset.key]=el.value);persist();renderDetail()}
function addAccount(){const id='client-'+Date.now();data.unshift({id,company:'New Client',contact:'',email:'',cancelDate:'',status:'Not Started',reason:'',productUpdates:'',subject:'',draft:'',lastContact:'',nextStep:'',notes:''});selected=id;persist();renderDetail()}
function deleteCurrent(){const x=data.find(a=>a.id===selected);if(!confirm(`Delete ${x.company}?`))return;data=data.filter(a=>a.id!==selected);selected=data[0]?.id||null;persist();renderDetail()}
async function copyEmail(){const x=data.find(a=>a.id===selected),text=`Subject: ${x.subject}\n\n${x.draft}`;try{await navigator.clipboard.writeText(text);alert('Email copied.')}catch(e){prompt('Copy email:',text)}}
function exportData(){saveCurrent();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`client-win-back-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming))throw Error();data=incoming;selected=data[0]?.id||null;persist();renderDetail();alert('Backup imported.')}catch(err){alert('That file is not a valid dashboard backup.')}};r.readAsText(f)}
renderStats();renderList();renderDetail();
</script></body></html>
